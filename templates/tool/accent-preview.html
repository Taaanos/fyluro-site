{# Ephemeral Fyluro accent preview switcher (remove once final accent is picked). #}
<div class="accent-preview-bar" role="region" aria-label="Accent color preview">
  <div class="container accent-preview-inner">
    <span class="accent-preview-label">Accent preview (temporary)</span>
    <div class="segmented" role="group" aria-label="Choose Fyluro accent color">
      <button type="button" data-accent-set="forest" aria-pressed="false">
        <span class="accent-swatch accent-swatch-forest" aria-hidden="true"></span>Forest
      </button>
      <button type="button" data-accent-set="amber" aria-pressed="false">
        <span class="accent-swatch accent-swatch-amber" aria-hidden="true"></span>Amber
      </button>
      <button type="button" data-accent-set="terracotta" aria-pressed="false">
        <span class="accent-swatch accent-swatch-terracotta" aria-hidden="true"></span>Terracotta
      </button>
      <button type="button" data-accent-set="slate" aria-pressed="false">
        <span class="accent-swatch accent-swatch-slate" aria-hidden="true"></span>Slate
      </button>
    </div>
  </div>
</div>
